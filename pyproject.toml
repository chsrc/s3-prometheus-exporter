[project]
name = "s3-prometheus-exporter"
version = "0.1.0"
description = "Prometheus exporter for Amazon S3 bucket statistics"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.35,<2",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
s3-prometheus-exporter = "app.main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88