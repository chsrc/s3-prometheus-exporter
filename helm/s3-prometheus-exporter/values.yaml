replicaCount: 1

image:
  repository: ghcr.io/example/s3-prometheus-exporter
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8000

scanIntervalSeconds: 900

aws:
  region: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 5m
  scrapeTimeout: 30s

nodeSelector: {}

tolerations: []

affinity: {}