replicaCount: 1

nameOverride: ""

fullnameOverride: ""

image:
  repository: ghcr.io/example/s3-prometheus-exporter
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 9222

scanIntervalSeconds: 900

debug: 
  #if true, instead of using S3 metrics, it just returns mock data
  fakeS3: false

aws:
  endpoint: ""
  region: ""
  signatureVersion: "v4"
  s3ForcePathStyle: true
  insecureSkipVerify: true

  credentials:
    secretName: ""
    accessKeyIdKey: ""
    secretAccessKeyKey: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 5m
  scrapeTimeout: 30s

nodeSelector: {}

tolerations: []

affinity: {}