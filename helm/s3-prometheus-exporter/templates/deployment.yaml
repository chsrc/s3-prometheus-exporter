apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s3-prometheus-exporter.fullname" . }}
  labels:
    {{- include "s3-prometheus-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "s3-prometheus-exporter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        {{- include "s3-prometheus-exporter.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "s3-prometheus-exporter.serviceAccountName" . }}

      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: metrics
              containerPort: {{ .Values.service.port}}
              protocol: TCP

          env:
            - name: METRICS_PORT
              value: {{ .Values.service.port | quote }}

            - name: SCAN_INTERVAL_SECONDS
              value: {{ .Values.scanIntervalSeconds | quote }}

            - name: FAKE_S3
              value: {{ .Values.debug.fakeS3 | quote }} 
          
            {{- if .Values.aws.region }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
